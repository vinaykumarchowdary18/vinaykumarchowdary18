name: Update Profile Stats Cards
on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create output folder
        run: mkdir -p profile-stats

      - name: Fetch GitHub Stats card
        run: |
          curl -sSL "https://github-readme-stats.vercel.app/api?username=vinaykumarchowdary18&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=00F5D4&icon_color=4285F4&text_color=c9d1d9" \
            -o profile-stats/stats.fetched.svg
          echo "--- raw response (first 300 chars) ---"
          head -c 300 profile-stats/stats.fetched.svg

      - name: Fetch Top Languages card
        run: |
          curl -sSL "https://github-readme-stats.vercel.app/api/top-langs/?username=vinaykumarchowdary18&layout=compact&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=00F5D4&text_color=c9d1d9" \
            -o profile-stats/top-langs.fetched.svg
          echo "--- raw response (first 300 chars) ---"
          head -c 300 profile-stats/top-langs.fetched.svg

      - name: Fetch Streak Stats card
        run: |
          curl -sSL "https://streak-stats.demolab.com?user=vinaykumarchowdary18&theme=tokyonight&hide_border=true&background=0D1117&ring=00F5D4&fire=F80000&currStreakLabel=4285F4&sideNums=00F5D4" \
            -o profile-stats/streak.fetched.svg
          echo "--- raw response (first 300 chars) ---"
          head -c 300 profile-stats/streak.fetched.svg

      - name: Validate and promote (or fall back to placeholder)
        run: |
          # A file is only "valid" if it's a real, sizeable SVG and doesn't contain
          # known error-card / error-page text (github-readme-stats sometimes wraps
          # its error message INSIDE a technically-valid <svg> tag).
          is_valid () {
            local f="$1"
            [ -s "$f" ] || return 1
            grep -q "<svg" "$f" || return 1
            grep -qi "something went wrong\|rate limit\|maximum retries\|FUNCTION_INVOCATION\|NOT_FOUND\|server error" "$f" && return 1
            # Real cards are always well over 1KB; anything tiny is a stub/error page.
            [ "$(wc -c < "$f")" -ge 500 ] || return 1
            return 0
          }

          make_placeholder () {
            local label="$1" out="$2"
            cat > "$out" <<SVG
          <svg xmlns="http://www.w3.org/2000/svg" width="495" height="120">
            <rect width="100%" height="100%" rx="8" fill="#0D1117" stroke="#30363d"/>
            <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
                  fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="15">
              ${label} temporarily unavailable — check back soon
            </text>
          </svg>
          SVG
          }

          declare -A NAMES=( [stats]="GitHub Stats" [top-langs]="Top Languages" [streak]="GitHub Streak" )

          for key in stats top-langs streak; do
            fetched="profile-stats/${key}.fetched.svg"
            final="profile-stats/${key}.svg"

            if is_valid "$fetched"; then
              echo "✅ ${key}: fresh fetch is valid, promoting it."
              mv "$fetched" "$final"
            elif [ -f "$final" ] && is_valid "$final"; then
              echo "⚠️  ${key}: fresh fetch invalid, but existing committed version IS valid — keeping it."
              rm -f "$fetched"
            else
              echo "❌ ${key}: fresh fetch invalid AND no valid version on record — writing placeholder."
              make_placeholder "${NAMES[$key]}" "$final"
              rm -f "$fetched"
            fi
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-stats/
          git diff --cached --quiet || git commit -m "chore: update profile stats cards [skip ci]"
          git push
